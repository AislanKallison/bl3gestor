<style>

.tw{overflow-x:auto}

.st.SemPendência,.st.Baixado,.st.Paga{background:#CFF8D2;color:#075A0F}.st.AGFísico,.st.Prevista{background:#FFE3B0;color:#7A4700}.st.AGCRCliente{background:#FFE9B8;color:#8A5A00}.st.ND{background:var(--bg);color:var(--mute)}
dialog{border:0;border-radius:16px;padding:22px;width:min(440px,92vw);background:var(--card);color:var(--ink)}

.gbtn{width:100%;background:#fff;color:#1F1F1F;border:1.5px solid #DADCE0;display:flex;gap:10px;justify-content:center;align-items:center}

.navout{display:inline-block;width:auto;padding:6px 0 0;margin-top:4px;color:#C9CCFF;text-decoration:underline;font-size:13px}
.vl{font-size:11px;color:#9EA2E8;margin:4px 2px}

@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:column;align-items:stretch;padding:12px;gap:4px}
main{padding:16px 14px 60px}.two{grid-template-columns:1fr}}
</style>
</head>

<script>
var $=function(s){return document.querySelector(s)};

var LINK_ERRO=/error_code=|error=access_denied/.test(location.hash+location.search);

try{if(window.supabase&&SUPABASE_URL.indexOf('http')===0&&SUPABASE_ANON_KEY.length>20)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
/* Enquanto sb for null, o sistema roda 100% em modo de demonstração (dados de mentira só no navegador).
   Assim que SUPABASE_URL/SUPABASE_ANON_KEY forem preenchidos, login, cadastro, Google, "esqueci minha
   senha" E os contratos/esteira/pendências/comissões/rankings/auditoria passam a ler e gravar de
   verdade no banco do Supabase, com cada perfil vendo só o que a política do banco permite. */
var PM=['AC Consignado','M&C Cred','Nossa Agência','PrimeCred'];
var PR=[],PRM=[],PRT=[],PRUID=[];
if(!sb){PR=['Ana Souza','Bruno Lima','Carla Mendes','Diego Rocha','Eduarda Alves','Felipe Costa','Gabriela Nunes','Heitor Dias','Isabela Reis','João Pedro'];
 PRM=[3,3,3,0,0,2,2,2,1,1]; /* índices já na nova ordem alfabética de PM: PrimeCred=3, AC Consignado=0, Nossa Agência=2, M&C Cred=1 */
 PRT=['Corretor','Corretor','Colaborador','Corretor','Colaborador','Corretor','Colaborador','Colaborador','Corretor','Colaborador'];
 PRUID=PR.map(function(){return null})}
var RP={'Corretor':70,'Colaborador':40,'Gestor':0};

var AUD=[];
var PERM={Admin:['dash','est','pend','rkp','rkd','com','atend','rel','aud','perm','planos'],Gestor:['dash','est','pend','rkp','rkd','com','atend','rel'],Corretor:['dash','est','pend','atend','rel'],Colaborador:['dash','est','atend']};
var NAV=[['dash','Dashboard'],['est','Esteira de contratos'],['pend','Pendências'],['rkp','Ranking de vendas'],['rkd','Ranking de produtos'],['com','Comissões'],['atend','Atendimento'],['rel','Relatórios'],['aud','Auditoria'],['perm','Permissões'],['planos','Planos e faturamento']];
var INTEG={hermes:'',deepseek:''};
var PLANO={};PM.forEach(function(n,i){PLANO[i]=i%2===0?'ia':'basic'});
function meLabel(){return S.role==='Admin'?'Admin':(PR[S.me]||'')+' ('+S.role+')'}
function alog(a,d){AUD.unshift({t:new Date(),u:meLabel(),a:a,d:d});
 if(sb&&CUR&&CUR.id)sb.from('auditoria').insert({usuario_id:CUR.id,acao:a,detalhe:d}).then(function(){},function(){})}
var PD=['Novo contrato','Refinanciamento','Portabilidade','Cartão consignado','Saque complementar'];
var CV=['INSS','SIAPE','Governo estadual','Prefeitura'];
var BK=['Banco Alfa','Banco Beta','Banco Gama'];
var ST=['Analise Banco','Concretizado','CR Cliente','Pendente','Cancelado'];
var PRODST=['Concretizado','CR Cliente'];
var FISICO_OPT=['-','Sem Pendência','AG. Físico','Baixado'];
var COMST_OPT=['AG. CR Cliente','Prevista','Paga'];
function stClass(s){s=String(s||'').replace(/\s+/g,'');return s==='-'?'ND':s}
var META=60000;
var COM={'Novo contrato':4.5,'Refinanciamento':3.8,'Portabilidade':5.2,'Cartão consignado':8,'Saque complementar':6};
var MOT=['Documento ilegível','Falta comprovante de renda','Assinatura divergente','Margem insuficiente'];
var seed=42;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var NM=['Maria','José','Antônia','Francisco','Raimundo','Lúcia','João','Marta','Pedro','Helena','Sebastião','Rita'],SN=['da Silva','Oliveira','Pereira','Santos','Ferreira','Barbosa','Nogueira','Câmara'];
var T=[],C=[];
if(!sb){
 for(var ti=0;ti<26;ti++){var tp=Math.floor(rnd()*PR.length),ia=rnd()<.55,stw=rnd(),tst=stw<.4?'Aguardando':stw<.75?'Em atendimento':'Resolvido';
  T.push({id:5000+ti,cli:NM[Math.floor(rnd()*NM.length)]+' '+SN[Math.floor(rnd()*SN.length)],canal:CANAIS[Math.floor(rnd()*3)],ass:ASSUNTOS[Math.floor(rnd()*6)],ia:ia,p:tp,st:tst,esp:Math.floor(rnd()*40)})}
 for(var i=0;i<120;i++){var r=rnd(),st=r<.3?'Concretizado':r<.45?'CR Cliente':r<.85?'Analise Banco':r<.95?'Pendente':'Cancelado';
  var pi=Math.floor(Math.pow(rnd(),1.3)*PR.length),pdw=rnd(),pd=pdw<.34?0:pdw<.55?2:pdw<.72?1:pdw<.9?3:4;
  var vb=Math.round((1500+rnd()*rnd()*50000)/100)*100;
  C.push({id:1001+i,cli:NM[Math.floor(rnd()*NM.length)]+' '+SN[Math.floor(rnd()*SN.length)],p:pi,pd:PD[pd],cv:CV[Math.floor(rnd()*4)],bk:BK[Math.floor(rnd()*3)],
   v:vb,vl:Math.round(vb*(0.85+rnd()*0.1)),pz:[48,72,84,96][Math.floor(rnd()*4)],st:st,d:Math.floor(rnd()*45),mot:st==='Pendente'?MOT[Math.floor(rnd()*4)]:'',
   fis:FISICO_OPT[Math.floor(rnd()*FISICO_OPT.length)],cst:COMST_OPT[Math.floor(rnd()*COMST_OPT.length)]})}
}
/* T (fila de atendimento) segue em demonstração mesmo com Supabase ativo — é a próxima etapa a migrar */
var S={v:'dash',per:30,q:'',fs:'',pm:'',t:'',role:'Admin',real:'',me:0,gestorProm:0,af:''};
function minhaPromotoraIdx(){return S.role==='Gestor'?S.gestorProm:PRM[S.me]}
function meuEscopo(p){return S.role==='Admin'||(S.role==='Gestor'?PRM[p]===S.gestorProm:p===S.me)}
function today(d){var x=new Date();x.setDate(x.getDate()-d);return x}
function fd(d){return today(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function pmn(c){return PM[PRM[c.p]]}
function base(){return C.filter(function(c){return (!S.pm||PRM[c.p]==S.pm)&&meuEscopo(c.p)})}
function pmSel(){if(S.role!=='Admin')return '<span class="mu" style="align-self:center">'+esc(PM[minhaPromotoraIdx()])+(S.role==='Gestor'?'':' · '+esc(PR[S.me]))+'</span>';return '<select onchange="S.pm=this.value;go(S.v)" aria-label="Promotora"><option value="">Todas as promotoras</option>'+PM.map(function(n,i){return '<option value="'+i+'"'+(S.pm===String(i)?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'}
function prod(){return base().filter(function(c){return PRODST.indexOf(c.st)>-1&&c.d<S.per})}
function sum(a){return a.reduce(function(s,c){return s+c.v},0)}
function group(a,key){var m={};a.forEach(function(c){var k=typeof key==='function'?key(c):c[key];(m[k]=m[k]||[]).push(c)});return Object.keys(m).map(function(k){return{k:k,list:m[k],t:sum(m[k])}}).sort(function(a,b){return b.t-a.t})}
function comm(c){return c.v*(COM[c.pd]||0)/100}
function perSel(){return pmSel()+'<select onchange="S.per=+this.value;go(S.v)" aria-label="Período"><option value="7"'+(S.per==7?' selected':'')+'>Últimos 7 dias</option><option value="30"'+(S.per==30?' selected':'')+'>Últimos 30 dias</option><option value="999"'+(S.per==999?' selected':'')+'>Todo o período</option></select>'}
function head(t,s,extra){return '<div class="top"><div><h1>'+t+'</h1><p class="sub">'+s+'</p></div><div class="tools">'+(extra||'')+'</div></div>'}
function rank(list,max,fmt,medal){return list.map(function(g,i){return '<div class="rk"><span class="pos '+(i==0?'p1':'')+'">'+(i+1)+'</span><div><b>'+g.k+'</b><div class="mu">'+(fmt?fmt(g.k)+' · ':'')+g.list.length+' contratos · ticket '+brl(g.t/g.list.length)+'</div></div><b>'+brl(g.t)+'</b><div class="bar '+(medal?'m':'')+'"><i style="width:'+Math.max(2,g.t/max*100)+'%"></i></div></div>'}).join('')}

var V={
dash:function(){var p=prod(),all=base().filter(function(c){return c.d<S.per}),ok=all.filter(function(c){return PRODST.indexOf(c.st)>-1}).length;
 var days=[];for(var d=13;d>=0;d--){days.push({d:d,t:sum(base().filter(function(c){return c.d===d&&PRODST.indexOf(c.st)>-1}))})}var mx=Math.max.apply(null,days.map(function(x){return x.t}))||1;
 var fun=ST.map(function(s){return{k:s,list:all.filter(function(c){return c.st===s}),t:0}});fun.forEach(function(f){f.t=f.list.length});

 var alvo=['banco','cliente','cpf','valor','bruto','liquido','parcelas','prazo','status','situacao','vendedor','agente','produto','tipo','convenio','n','no','data','operacao','promotora'].map(normH);
 var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
 var melhorIdx=0,melhorScore=-1;
 for(var i=0;i<Math.min(raw.length,10);i++){

function validarCPF(cpf){cpf=String(cpf||'').replace(/\D/g,'');
 if(cpf.length!==11||/^(\d)\1{10}$/.test(cpf))return false;
 var soma=0,i,d1,d2;
 for(i=0;i<9;i++)soma+=+cpf[i]*(10-i);d1=(soma*10)%11;if(d1===10)d1=0;if(d1!==+cpf[9])return false;
 soma=0;for(i=0;i<10;i++)soma+=+cpf[i]*(11-i);d2=(soma*10)%11;if(d2===10)d2=0;return d2===+cpf[10]}
function parseDataBR(s){s=String(s||'').trim();if(!s)return null;
 var m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(!m)return null;
 var d=+m[1],mo=+m[2],y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):new Date().getFullYear();
 var dt=new Date(y,mo-1,d);if(isNaN(dt.getTime()))return null;
 var pad=function(n){return(n<10?'0':'')+n};
 return{iso:dt.toISOString(),dataPura:y+'-'+pad(mo)+'-'+pad(d),dias:Math.max(0,Math.floor((Date.now()-dt.getTime())/86400000))}}
function norm(s){return String(s==null?'':s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function numBR(v){if(typeof v==='number')return v;
 var s=String(v==null?'':v).trim();if(!s)return NaN;
 if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)||/^-?\d+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');
 return parseFloat(s)}
function col(r,nomes){for(var i=0;i<nomes.length;i++){var alvo=norm(nomes[i]);for(var k in r){if(norm(k)===alvo&&r[k]!=='')return r[k]}}return ''}

function processarImportacao(rows){
 if(!rows.length){toast('Planilha vazia ou em formato não reconhecido');return}
 var ok=0,atualizados=0,erro=0,erros=[];
 rows.forEach(function(r,idx){

  var cli=String(col(r,['Cliente'])).trim(),v=numBR(col(r,['Bruto','Valor'])),pz=numBR(col(r,['Parcelas','Prazo']));
  if(cli.length<3){erro++;erros.push('L'+linha+': Cliente inválido');return}
  if(!(v>=500)){erro++;erros.push('L'+linha+': Bruto inválido');return}
  if(!(pz>=1)){erro++;erros.push('L'+linha+': Parcelas inválido');return}

  var temTipo=col(r,['Tipo'])!=='';
  var pd=String(temTipo?col(r,['Tipo']):(col(r,['Produto'])||PD[0])).trim();
  var tab=String(col(r,['Tabela'])||(temTipo?col(r,['Produto']):'')).trim();
  var cv=String(col(r,['Convênio'])||CV[0]).trim(),bk=String(col(r,['Banco'])||BK[0]).trim();
  var st=matchOpt(ST,col(r,['Status','Situação']))||'Analise Banco';
  var fis=matchOpt(FISICO_OPT,col(r,['Físico']))||'-';
  var cst=matchOpt(COMST_OPT,col(r,['Comissão']))||'AG. CR Cliente';
  var cpf=String(col(r,['CPF'])).trim();
  if(cpf&&!validarCPF(cpf)){erro++;erros.push('L'+linha+': CPF inválido');return}
  var nascE=parseDataBR(col(r,['Nascimento'])),aversE=parseDataBR(col(r,['Averbação']));
  var tel=String(col(r,['Telefone'])).trim(),mat=String(col(r,['Matrícula'])).trim(),mot=String(col(r,['Motivo'])).trim(),obs=String(col(r,['Observações'])).trim();
  var vendNome=String(col(r,['Vendedor','Agente'])).trim(),promNome=String(col(r,['Promotora'])).trim();
  var vi=vendNome?PR.findIndex(function(n){return norm(n)===norm(vendNome)}):-1;
  if(vendNome&&vi<0){erro++;erros.push('L'+linha+': vendedor "'+vendNome+'" não encontrado');return}
  if(vi>-1&&promNome&&PM[PRM[vi]]&&norm(PM[PRM[vi]])!==norm(promNome)){
   erro++;erros.push('L'+linha+': "'+vendNome+'" não é da promotora "'+promNome+'"');return}
  if(vi<0){
   if(S.role==='Corretor'||S.role==='Colaborador')vi=S.me;
   else if(S.role==='Gestor'&&CUR&&CUR.id&&PRUID.indexOf(CUR.id)>-1)vi=PRUID.indexOf(CUR.id);
   else{erro++;erros.push('L'+linha+': informe a coluna Vendedor');return}}
  var dt=parseDataBR(col(r,['Data','Operação']));
  var numExistente=+col(r,['Nº','No','N']);
  var existente=numExistente?C.filter(function(c){return c.id===numExistente})[0]:null;

  var camposLocais={cli:cli,p:vi,pd:pd,cv:cv,bk:bk,v:v,vl:vl,pz:pz,st:st,fis:fis,cst:cst,cpf:cpf,nasc:nascE?nascE.dataPura:'',tel:tel,mat:mat,aver:aversE?aversE.dataPura:'',mot:st==='Pendente'?mot:'',obs:obs,tab:tab};
  if(existente){
   var patch={cliente:cli,produto:pd,convenio:cv,banco:bk,valor:v,valor_liquido:vl,parcelas:pz,status:st,fisico:fis,status_comissao:cst,
    cpf:cpf||null,telefone:tel||null,matricula:mat||null,data_nascimento:nascE?nascE.dataPura:null,data_averbacao:aversE?aversE.dataPura:null,
    motivo_pendencia:st==='Pendente'?(mot||null):null,observacoes:obs||null,tabela:tab||null};
   if(sb){sb.from('contratos').update(patch).eq('id',existente.id).then(function(res){
     if(!res.error){Object.assign(existente,camposLocais);if(S.v==='est')tb()}
     else erros.push('L'+linha+': '+res.error.message)})}
   else Object.assign(existente,camposLocais);
   atualizados++;return}

  if(sb){var payload={cliente:cli,vendedor_id:PRUID[vi],produto:pd,convenio:cv,banco:bk,valor:v,valor_liquido:vl,parcelas:pz,status:st,fisico:fis,status_comissao:cst,
    cpf:cpf||null,telefone:tel||null,matricula:mat||null,data_nascimento:nascE?nascE.dataPura:null,data_averbacao:aversE?aversE.dataPura:null,
    motivo_pendencia:st==='Pendente'?(mot||null):null,observacoes:obs||null,tabela:tab||null};
   if(dt)payload.criado_em=dt.iso;
   sb.from('contratos').insert(payload).select().single().then(function(res){
    if(!res.error){C.unshift(Object.assign({id:res.data.id,d:dt?dt.dias:0},camposLocais));if(S.v==='est')tb()}})
  }else{var nid=Math.max.apply(null,C.map(function(c){return c.id}).concat([0]))+1;
   C.push(Object.assign({id:nid,d:dt?dt.dias:0},camposLocais))}
  ok++});
 var resumo=ok+' novo(s), '+atualizados+' atualizado(s)'+(erro?(', '+erro+' com erro'):'');
 alog('Importação de planilha',resumo+(erros.length?(' — '+erros.slice(0,5).join(' | ')):''));
 toast(resumo);
 go('est')}

function renderAuth(){var m=A.mode,n=A.msg?'<div class="anote" role="status">'+A.msg+'</div>':'',h=LOGO,g='<button type="button" class="btn gbtn" onclick="showAuth(\'google\')">'+GLOGO+' Continuar com Google</button>',or='<div class="or">ou</div>';
 if(m==='login')h+='<h1>Entrar</h1><p class="sub">Acesse o sistema da financeira</p>'+n+'<label class="al" for="a_em">E-mail</label><input id="a_em" type="email" autocomplete="username" inputmode="email">'+pwField('a_pw','Senha','current-password')+'<div class="aerr" id="a_err" role="alert"></div><button id="a_go" class="btn g" style="width:100%" onclick="doLogin()">Entrar</button>'+or+g+'<div class="alinks"><button class="lk" onclick="showAuth(\'forgot1\')">Esqueci minha senha</button><button class="lk" onclick="showAuth(\'signup\')">Criar conta</button></div>'+(sb?'':'<details class="anote"><summary style="cursor:pointer;font-weight:600">Acessos de demonstração</summary><div style="margin-top:8px;line-height:1.7">Admin: admin@bl3.com.br / Admin@123<br>Corretor: corretor@bl3.com.br / Corretor@123<br>Colaborador: colaborador@bl3.com.br / Colab@1234</div></details>');
 else if(m==='signup')h+='<h1>Criar conta</h1><p class="sub">Cadastre-se para acessar o sistema</p>'+n+'<label class="al" for="a_nm">Nome completo</label><input id="a_nm" autocomplete="name">'+'<label class="al" for="a_em">E-mail</label><input id="a_em" type="email" autocomplete="username" inputmode="email">'+roleFields()+pwField('a_pw','Senha','new-password')+pwField('a_pw2','Confirmar senha','new-password')+'<div class="aerr" id="a_err" role="alert"></div><button id="a_go" class="btn g" style="width:100%" onclick="doSignup()">Criar conta</button>'+or+g+'<div class="alinks"><button class="lk" onclick="showAuth(\'login\')">Já tenho conta</button></div>';
 else if(m==='google')h+='<h1>Continuar com Google</h1><p class="sub">Escolha sua conta Google</p><div class="anote">Simulação: o login real com o Google exige um servidor de autenticação (OAuth). Aqui você informa a conta Gmail para testar o fluxo.</div><label class="al" for="a_gnm">Nome</label><input id="a_gnm" autocomplete="name"><label class="al" for="a_em">E-mail Gmail</label><input id="a_em" type="email" inputmode="email" placeholder="voce@gmail.com">'+roleFields()+'<p class="mu" style="font-size:12px">O perfil só é usado no primeiro acesso.</p><div class="aerr" id="a_err" role="alert"></div><button id="a_go" class="btn g" style="width:100%" onclick="doGoogle()">Continuar</button><div class="alinks"><button class="lk" onclick="showAuth(\'login\')">Voltar ao login</button></div>';
 else if(m==='forgot1')h+='<h1>Esqueci minha senha</h1><p class="sub">Informe seu e-mail para receber um código de redefinição</p>'+n+'<label class="al" for="a_em">E-mail</label><input id="a_em" type="email" autocomplete="username" inputmode="email"><div class="aerr" id="a_err" role="alert"></div><button id="a_go" class="btn g" style="width:100%" onclick="doForgot1()">Enviar código</button><div class="alinks"><button class="lk" onclick="showAuth(\'login\')">Voltar ao login</button></div>';
 else if(sb)h+='<h1>Nova senha</h1><p class="sub">Escolha uma nova senha para sua conta</p>'+n+pwField('a_pw','Nova senha','new-password')+pwField('a_pw2','Confirmar nova senha','new-password')+'<div class="aerr" id="a_err" role="alert"></div><button id="a_go" class="btn g" style="width:100%" onclick="doForgot2()">Redefinir senha</button><div class="alinks"><button class="lk" onclick="showAuth(\'login\')">Voltar ao login</button></div>';
 else h+='<h1>Nova senha</h1><p class="sub">Digite o código recebido e escolha uma nova senha</p>'+n+'<label class="al" for="a_cod">Código de 6 dígitos</label><input id="a_cod" inputmode="numeric" maxlength="6" autocomplete="one-time-code">'+pwField('a_pw','Nova senha','new-password')+pwField('a_pw2','Confirmar nova senha','new-password')+'<div class="aerr" id="a_err" role="alert"></div><button id="a_go" class="btn g" style="width:100%" onclick="doForgot2()">Redefinir senha</button><div class="alinks"><button class="lk" onclick="showAuth(\'forgot1\')">Reenviar código</button><button class="lk" onclick="showAuth(\'login\')">Voltar ao login</button></div>';
 document.getElementById('authBox').innerHTML=h;var f=document.querySelector('#authBox input');if(f)setTimeout(function(){f.focus()},30)}
function loginOk(u,note){CUR=u;S.real=u.role;S.role=u.role;
 if(u.role==='Gestor'){S.gestorProm=u.prom||0;S.me=0}else{S.me=u.role==='Admin'?0:ensureVendor(u)}
 S.v='dash';S.pm='';S.af='';
 document.getElementById('auth').style.display='none';document.body.classList.remove('locked');renderNav();go('dash');alog(note||'Login realizado',u.email);if(note)toast(note)}
function logout(){alog('Logout',CUR?CUR.email:'');var done=function(){CUR=null;S.real='';S.role='Admin';
 if(dlg.open)dlg.close();document.body.classList.add('locked');document.getElementById('auth').style.display='grid';showAuth('login','Você saiu do sistema.')};
 if(sb)return sb.auth.signOut().then(done);sset('bl3_session',null);done()}
function traduzErro(m){if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
 if(/already registered|already exists/i.test(m))return 'Este e-mail já está cadastrado.';
 if(/Password should be/i.test(m))return PWMSG;
 if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
 return m}
function carregarPromotoras(){return sb.from('promotoras').select('id,nome').order('nome').then(function(r){
 if(!r.error&&r.data&&r.data.length){PM=r.data.map(function(x){return x.nome});PM_IDS=r.data.map(function(x){return x.id})}
 else if(r.error)toast('Erro ao carregar promotoras: '+r.error.message)})}
function carregarPerfisEContratos(){
 return sb.from('profiles').select('id,nome,role,promotora_id').then(function(rp){
  if(rp.error){toast('Erro ao carregar equipe: '+rp.error.message);return{data:[]}}
  var vend=(rp.data||[]).filter(function(p){return p.role==='Corretor'||p.role==='Colaborador'||p.role==='Gestor'});
  PR=vend.map(function(p){return p.nome});PRUID=vend.map(function(p){return p.id});PRT=vend.map(function(p){return p.role});
  PRM=vend.map(function(p){var i=PM_IDS.indexOf(p.promotora_id);return i<0?0:i});
  return sb.from('contratos').select('*').order('id',{ascending:false})
 }).then(function(rc){
  if(!rc||rc.error){C=[];if(rc&&rc.error)toast('Erro ao carregar contratos: '+rc.error.message);return}
  C=(rc.data||[]).map(function(x){var vi=PRUID.indexOf(x.vendedor_id);
   if(vi<0){PR.push('(sem perfil)');PRUID.push(x.vendedor_id);PRM.push(0);PRT.push('Corretor');vi=PR.length-1}
   return{id:x.id,cli:x.cliente,p:vi,pd:x.produto||'',cv:x.convenio||'',bk:x.banco||'',v:+x.valor,pz:x.parcelas,st:x.status,d:Math.max(0,Math.floor((Date.now()-new Date(x.criado_em))/86400000)),mot:x.motivo_pendencia||'',cpf:x.cpf||'',nasc:x.data_nascimento||'',tel:x.telefone||'',mat:x.matricula||'',aver:x.data_averbacao||'',obs:x.observacoes||'',tab:x.tabela||'',vl:x.valor_liquido||null,fis:x.fisico||'-',cst:x.status_comissao||'AG. CR Cliente'}})
 })}
function resolveProfile(user,note){
 sb.from('profiles').select('*').eq('id',user.id).single().then(function(r){
  if(r.error||!r.data){
   var pend=sget('bl3_pending_role')||{},role=pend.role||'Colaborador',promIdx=(pend.prom!=null?pend.prom:0),nome=pend.nome||(user.email.split('@')[0]);
   sb.from('profiles').insert({id:user.id,nome:nome,role:role,promotora_id:role==='Admin'?null:PM_IDS[promIdx]}).then(function(ins){
    if(ins.error){aerr('Conta criada, mas houve um erro ao salvar o perfil: '+ins.error.message);return}
    sset('bl3_pending_role',null);
    carregarPerfisEContratos().then(function(){loginOk({name:nome,email:user.email,role:role,prom:promIdx,id:user.id,provider:'supabase'},note||'Conta criada com sucesso')})})
  }else{
   var promIdx=PM_IDS.indexOf(r.data.promotora_id);
   carregarPerfisEContratos().then(function(){loginOk({name:r.data.nome,email:user.email,role:r.data.role,prom:promIdx<0?0:promIdx,id:user.id,provider:'supabase'},note)})
  }})}
function doLogin(){if(sb)return doLoginReal();return doLoginDemo()}
function doLoginReal(){var em=gv('a_em').trim().toLowerCase(),pw=gv('a_pw');
 if(!em||!pw)return aerr('Informe e-mail e senha.');
 sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
  if(r.error)return aerr(traduzErro(r.error.message));
  resolveProfile(r.data.user)})}
function doLoginDemo(){var em=gv('a_em').trim().toLowerCase(),pw=gv('a_pw');
 if(Date.now()<FAIL.until)return aerr('Muitas tentativas. Aguarde 30 segundos e tente novamente.');
 if(!em||!pw)return aerr('Informe e-mail e senha.');
 var u=findU(em);
 hp(em,pw).then(function(h){
  if(!u||!u.hash||u.hash!==h){FAIL.n++;if(FAIL.n>=5){FAIL.until=Date.now()+30000;FAIL.n=0}return aerr('E-mail ou senha incorretos.')}
  FAIL.n=0;sset('bl3_session',u.email);loginOk(u)})}
function checkRole(nm){var role=gv('a_role');
 if(EXIGIR_CONVITE&&role==='Admin'){if(gv('a_code').trim()!==ADMIN_CODE)return 'Código de convite inválido.'}
 if(role!=='Admin'){var prom=+gv('a_prom');for(var i=0;i<PR.length;i++){if(PR[i]===nm&&PRM[i]===prom)return 'Já existe um vendedor com esse nome nessa promotora. Use seu nome completo.'}}
 return ''}
function newUser(nm,em,h,prov){var role=gv('a_role'),u={name:nm,email:em,role:role,prom:role==='Admin'?0:+gv('a_prom'),hash:h,provider:prov};USERS.push(u);saveUsers();ensureVendor(u);sset('bl3_session',u.email);return u}
function doSignup(){if(sb)return doSignupReal();return doSignupDemo()}
function doSignupReal(){var nm=gv('a_nm').trim(),em=gv('a_em').trim().toLowerCase(),pw=gv('a_pw'),pw2=gv('a_pw2'),role=gv('a_role'),prom=role==='Admin'?null:+gv('a_prom');
 if(!okName(nm))return aerr('Informe seu nome completo (apenas letras).');
 if(!okEmail(em))return aerr('Informe um e-mail válido.');
 if(!okPw(pw))return aerr(PWMSG);
 if(pw!==pw2)return aerr('As senhas não conferem.');
 if(EXIGIR_CONVITE&&(role==='Admin'||role==='Gestor')){var cod=gv('a_code').trim();if(!cod)return aerr('Informe o código de convite.');
  return sb.rpc('validar_convite',{p_codigo:cod,p_role:role,p_promotora_id:role==='Gestor'?prom:null}).then(function(rc){
   if(rc.error||!rc.data)return aerr('Código de convite inválido para esse perfil/promotora.');
   criarContaReal(nm,em,pw,role,prom)})}
 criarContaReal(nm,em,pw,role,prom)}
function criarContaReal(nm,em,pw,role,promIdx){
 sb.auth.signUp({email:em,password:pw}).then(function(r){
  if(r.error)return aerr(traduzErro(r.error.message));
  if(!r.data.session)return showAuth('login','Enviamos um e-mail de confirmação para '+em+'. Clique no link para ativar sua conta e depois entre normalmente.');
  var uid=r.data.user.id;
  sb.from('profiles').insert({id:uid,nome:nm,role:role,promotora_id:role==='Admin'?null:PM_IDS[promIdx]}).then(function(pr){
   if(pr.error)return aerr('Conta criada, mas houve um erro ao salvar o perfil: '+pr.error.message);
   carregarPerfisEContratos().then(function(){loginOk({name:nm,email:em,role:role,prom:promIdx||0,id:uid,provider:'supabase'},'Conta criada com sucesso')})})})}
function doSignupDemo(){var nm=gv('a_nm').trim(),em=gv('a_em').trim().toLowerCase(),pw=gv('a_pw'),pw2=gv('a_pw2');
 if(!okName(nm))return aerr('Informe seu nome completo (apenas letras).');
 if(!okEmail(em))return aerr('Informe um e-mail válido.');
 if(findU(em))return aerr('Este e-mail já está cadastrado.');
 var er=checkRole(nm);if(er)return aerr(er);
 if(!okPw(pw))return aerr(PWMSG);
 if(pw!==pw2)return aerr('As senhas não conferem.');
 hp(em,pw).then(function(h){loginOk(newUser(nm,em,h,'email'),'Conta criada com sucesso')})}
function doGoogle(){if(sb)return doGoogleReal();return doGoogleDemo()}
function doGoogleReal(){var role=gv('a_role'),prom=role==='Admin'?null:+gv('a_prom'),nome=gv('a_gnm').trim(),ir=function(){sset('bl3_pending_role',{role:role,prom:prom,nome:nome});
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}})};
 if(EXIGIR_CONVITE&&(role==='Admin'||role==='Gestor')){var cod=gv('a_code').trim();if(!cod)return aerr('Informe o código de convite.');
  return sb.rpc('validar_convite',{p_codigo:cod,p_role:role,p_promotora_id:role==='Gestor'?prom:null}).then(function(rc){
   if(rc.error||!rc.data)return aerr('Código de convite inválido para esse perfil/promotora.');ir()})}
 ir()}
function doGoogleDemo(){var nm=gv('a_gnm').trim(),em=gv('a_em').trim().toLowerCase();
 if(!okEmail(em)||!/@(gmail|googlemail)\.com$/.test(em))return aerr('Informe um e-mail Gmail válido (voce@gmail.com).');
 var u=findU(em);
 if(u){if(u.provider!=='google')return aerr('Este e-mail já tem cadastro com senha. Entre com e-mail e senha.');sset('bl3_session',u.email);return loginOk(u)}
 if(!okName(nm))return aerr('Informe seu nome (apenas letras).');
 var er=checkRole(nm);if(er)return aerr(er);
 loginOk(newUser(nm,em,null,'google'),'Conta criada com Google')}
function doForgot1(){if(sb)return doForgot1Real();return doForgot1Demo()}
function doForgot1Real(){var em=gv('a_em').trim().toLowerCase();
 if(!okEmail(em))return aerr('Informe um e-mail válido.');
 sb.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+window.location.pathname}).then(function(r){
  if(r&&r.error)return aerr(/rate limit|security purposes|seconds/i.test(r.error.message)?'Muitos pedidos seguidos. Aguarde alguns minutos e tente de novo (limite de e-mails do Supabase).':'Não foi possível enviar: '+r.error.message);
  showAuth('login','Se o e-mail estiver cadastrado, enviamos um link de redefinição. Confira a caixa de entrada e o spam, e abra o link neste mesmo navegador.')})}
function doForgot1Demo(){var em=gv('a_em').trim().toLowerCase();
 if(!okEmail(em))return aerr('Informe um e-mail válido.');
 var u=findU(em);RST=null;
 if(u){var c;if(window.crypto&&crypto.getRandomValues){var r=new Uint32Array(1);crypto.getRandomValues(r);c=100000+r[0]%900000}else c=100000+Math.floor(Math.random()*900000);
  RST={email:u.email,code:String(c),exp:Date.now()+600000,tries:0}}
 showAuth('forgot2','Se o e-mail estiver cadastrado, enviamos um código de 6 dígitos válido por 10 minutos.'+(RST?'<br><b>Modo demonstração</b> (sem servidor de e-mail): seu código é <b>'+RST.code+'</b>.':''))}
function doForgot2(){if(sb)return doForgot2Real();return doForgot2Demo()}
function doForgot2Real(){var pw=gv('a_pw'),pw2=gv('a_pw2');
 if(!okPw(pw))return aerr(PWMSG);
 if(pw!==pw2)return aerr('As senhas não conferem.');
 sb.auth.updateUser({password:pw}).then(function(r){
  if(r.error)return aerr(traduzErro(r.error.message));
  RECOVERY=false;try{history.replaceState(null,'',location.pathname)}catch(e){}
  sb.auth.signOut().then(function(){showAuth('login','Senha redefinida com sucesso. Entre com a nova senha.')})})}
function doForgot2Demo(){var c=gv('a_cod').trim(),pw=gv('a_pw'),pw2=gv('a_pw2');
 if(!RST||Date.now()>RST.exp)return aerr('Código inválido ou expirado. Solicite um novo.');
 if(++RST.tries>5){RST=null;return aerr('Muitas tentativas. Solicite um novo código.')}
 if(c!==RST.code)return aerr('Código incorreto.');
 if(!okPw(pw))return aerr(PWMSG);
 if(pw!==pw2)return aerr('As senhas não conferem.');
 var em=RST.email;hp(em,pw).then(function(h){var u=findU(em);u.hash=h;saveUsers();RST=null;FAIL={n:0,until:0};showAuth('login','Senha redefinida com sucesso. Entre com a nova senha.')})}
function boot(){if(sb)return bootReal();return bootDemo()}
function bootReal(){showAuth('login');
 if(LINK_ERRO)showAuth('forgot1','Esse link expirou ou já foi usado. Informe seu e-mail para receber um novo.');
 else if(RECOVERY)showAuth('forgot2','Defina sua nova senha.');
 sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;showAuth('forgot2','Defina sua nova senha.')}});
 carregarPromotoras().then(function(){if(A.mode==='signup')renderAuth();
  sb.auth.getSession().then(function(r){var s=r.data.session;if(s&&!RECOVERY&&!LINK_ERRO)resolveProfile(s.user,'Sessão restaurada')})})}
function bootDemo(){USERS=sget('bl3_users')||[];
 var seed=[['Administrador BL3','admin@bl3.com.br','Admin','Admin@123'],['Bruno Lima','corretor@bl3.com.br','Corretor','Corretor@123'],['Carla Mendes','colaborador@bl3.com.br','Colaborador','Colab@1234']];
 function done(){USERS.forEach(ensureVendor);var em=sget('bl3_session'),u=em&&findU(em);if(u)loginOk(u,'Sessão restaurada');else showAuth('login')}
 showAuth('login');
 if(USERS.length)return done();
 Promise.all(seed.map(function(d){return hp(d[1],d[3])})).then(function(hs){
  USERS=seed.map(function(d,i){var pi=PR.indexOf(d[0]);return{name:d[0],email:d[1],role:d[2],prom:pi>-1?PRM[pi]:0,hash:hs[i],provider:'email'}});saveUsers();done()})}
document.getElementById('authBox').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){var b=document.getElementById('a_go');if(b)b.click()}});
boot();
</script>
